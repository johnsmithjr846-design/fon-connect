// NOTE: normally regenerated by "capacitor update" to point at
// ../node_modules/@capacitor/android/capacitor — repointed here to a
// vendored copy (android/capacitor-android-lib) so the project builds
// without requiring `npm install` on the machine opening Android Studio.
include ':capacitor-android'
project(':capacitor-android').projectDir = new File('./capacitor-android-lib')
